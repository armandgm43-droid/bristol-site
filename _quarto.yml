project:
  type: website
  output-dir: _site
  # Seuls les fichiers .qmd sont des pages du site.
  # Les fichiers .md (CONTEXTE_PROJET.md, README.md…) restent des documents de travail.
  render:
    - "*.qmd"
    - "matieres/**/*.qmd"
  # L'application de révision est copiée telle quelle dans le site.
  resources:
    - "revision/**"
    # Jetons de DA : aussi lus par revision/index.html (../assets/bristol-tokens.css).
    - "assets/bristol-tokens.css"
  # Port fixe pour quarto preview : la progression de révision (localStorage) est
  # propre à l'adresse http://localhost:4848. Ne pas changer ce port, ne pas passer
  # par 127.0.0.1 (autre adresse, progression vide). Voir architecture.md § 6 et § 8.
  preview:
    port: 4848
    browser: true

lang: fr

website:
  title: "Bristol"
  description: "Base de connaissances pour mes études d'ingénieur"
  search: true
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    left:
      - text: "Matières"
        href: index.qmd
      - text: "Révisions"
        href: revision/index.html
      - text: "Conventions"
        href: demo-conventions.qmd
  sidebar:
    - id: ts227
      title: "TS227"
      style: docked
      contents:
        - matieres/ts227-communications-numeriques/index.qmd
        - section: "Cours"
          contents:
            - matieres/ts227-communications-numeriques/cours/01-introduction.qmd
            - matieres/ts227-communications-numeriques/cours/02-communication-sans-bruit.qmd
            - matieres/ts227-communications-numeriques/cours/03-dsp-signaux-codes-en-ligne.qmd
            - matieres/ts227-communications-numeriques/cours/04-transmission-presence-bruit.qmd
        # Ajouter les chapitres au fur et à mesure, dans l'ordre :
        # - section: "Cours"
        #   contents:
        #     - matieres/ts227-communications-numeriques/cours/01-introduction.qmd

format:
  html:
    theme:
      light: [cosmo, assets/bristol.scss]
      dark: [cosmo, assets/bristol.scss, assets/bristol-sombre.scss]
    # Mode sombre : suit le système, sauf choix explicite (bouton de la barre).
    respect-user-color-scheme: true
    # Couleurs, polices, espacements : source unique, partagée avec revision/.
    css: assets/bristol-tokens.css
    toc: true
    toc-title: "Sur cette page"
    number-sections: true
    html-math-method: mathjax
    crossref:
      eq-prefix: "équation"
      fig-prefix: "figure"
      tbl-prefix: "tableau"
      sec-prefix: "section"
      def-prefix: "définition"
      thm-prefix: "théorème"
      prp-prefix: "propriété"
      prp-title: "Propriété"
      exm-prefix: "exemple"
